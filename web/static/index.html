<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>混合键合知识图谱</title>
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try { const t = localStorage.getItem("kg-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=20261106md1">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/ask">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="17" r="2.8"/><path d="M7.8 8.3 10.6 15M16.4 7.9 13.5 14.8M8.4 6.8h7.2"/></svg>
        </span>
        <span>
          <strong>混合键合</strong>
          <small>文献 · 问答 · 知识图谱</small>
        </span>
      </a>
      <div class="workspace-picker"><span>知识库架构</span>
        <div class="workspace-options" role="group" aria-label="切换知识库架构">
          <button type="button" data-arch="demo">自制 Demo</button>
          <button type="button" data-arch="raganything">RAG-Anything</button>
        </div>
        <select id="workspace-arch" aria-label="知识库架构">
          <option value="demo">简易自制架构 Demo</option>
          <option value="raganything">RAG-Anything</option>
        </select>
      </div>
      <nav class="nav" id="nav">
        <span class="nav-indicator" aria-hidden="true"></span>
        <a href="#/ask" data-route="ask"><svg viewBox="0 0 24 24"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/><path d="M8 8h8M8 12h5"/></svg>论文问答</a>
        <a href="#/ideas" data-route="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>创新点生成</a>
        <a href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>文献库</a>
        <a href="#/search" data-route="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>全文检索</a>
        <a href="#/ingestion" data-route="ingestion"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M4 14v6h16v-6"/></svg>文献入库</a>
        <a href="#/report" data-route="report"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 12l3-3 2 2 4-4"/></svg>项目概况</a>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot">
        <p class="muted">正在载入试点数据…</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-kicker" id="drawer-kicker"></span>
      <div class="drawer-actions">
        <span class="drawer-nav" id="drawer-nav"></span>
        <button class="icon-btn" id="drawer-close" aria-label="关闭（Esc）">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/ingestion.js?v=20261105api1"></script>
  <script src="/static/report.js"></script>
  <script src="/static/innovation.js?v=20261107b"></script>
  <script src="/static/app.js?v=kg2-d9b5e873f4"></script>
</body>
</html>
